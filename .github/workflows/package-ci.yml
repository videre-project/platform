name: Package and workspace checks

on:
  pull_request:
    paths:
      - '.github/workflows/package-ci.yml'
      - '.github/workflows/release-packages.yml'
      - 'packages/**'
      - 'services/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - '.node-version'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Optional release version to apply before validation.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: 15432
      PGDATABASE: mtgo
      PGUSER: public_api
      PGSSL: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        if: inputs.version != ''
        run: node scripts/set-package-version.mjs "${{ inputs.version }}"

      - name: Start public database bridge
        env:
          CLOUDFLARED_VERSION: 2026.7.3
          CLOUDFLARED_HOSTNAME: public-db.videreproject.com
          CLOUDFLARED_PORT: 15432
        run: |
          set -euo pipefail
          cloudflared="$RUNNER_TEMP/cloudflared"
          curl --fail --silent --show-error --location \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            --output "$cloudflared"
          chmod +x "$cloudflared"
          "$cloudflared" access tcp \
            --hostname "$CLOUDFLARED_HOSTNAME" \
            --url "127.0.0.1:${CLOUDFLARED_PORT}" \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"

          for attempt in {1..30}; do
            if (echo >/dev/tcp/127.0.0.1/$CLOUDFLARED_PORT) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/cloudflared.log"
          echo 'cloudflared did not open the local database port.' >&2
          exit 1

      - name: Lint
        run: pnpm lint

      - name: Check generated database types
        run: pnpm db:check-types

      - name: Build shared packages
        run: pnpm --filter './packages/*' -r run build

      - name: Typecheck packages and services
        run: pnpm --filter './packages/*' --filter './services/*' -r run typecheck

      - name: Test packages and services
        run: pnpm --filter './packages/*' --filter './services/*' -r run test

      - name: Build website
        run: pnpm build

      - name: Stop public database bridge
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/cloudflared.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/cloudflared.pid")" 2>/dev/null || true
          fi
